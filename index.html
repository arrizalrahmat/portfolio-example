<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="main">
      <header class="header">
        <img
          src="https://www.publicbooks.org/wp-content/uploads/2017/01/Doni-Gewirtzman-e1490108792253.jpg"
          alt="logo"
          class="thumbnail" />
        <section
          class="identity"
          aria-label="Profile information">
          <p class="name">Arrizal Rahmat Kurniawan S.Kom</p>
          <p class="job">Mobile Developer</p>
          <div class="cta-container">
            <button class="cta-button contact-button">
              Kontak
            </button>
            <button class="cta-button resume-button">
              Resume
            </button>
          </div>
        </section>
        <section
          class="details"
          aria-label="Additional profile details">
          <div class="detail-row">
            <strong>Availability</strong>
            <span>Full Time</span>
          </div>
          <div class="detail-row">
            <strong>Usia</strong>
            <span>17</span>
          </div>
          <div class="detail-row">
            <strong>Lokasi</strong>
            <span>Jakarta, Indonesia</span>
          </div>
          <div class="detail-row">
            <strong>Pengalamanasdasdas</strong>
            <span>2</span>
          </div>
          <div class="detail-row">
            <strong>Email</strong>
            <span>Developer@gmail.com</span>
          </div>
        </section>
      </header>
      <form class="profile-form">
        <label for="name">Nama</label>
        <input id="name" name="name" type="text" />

        <label for="role">Role</label>
        <input id="role" name="role" type="text" />

        <label for="availability">Availability</label>
        <input
          id="availability"
          name="availability"
          type="text" />

        <label for="age">Age</label>
        <input id="age" name="age" type="number" />

        <label for="location">Lokasi</label>
        <input id="location" name="location" type="text" />

        <label for="experience">Years Experience</label>
        <input
          id="experience"
          name="experience"
          type="number" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" />

        <button class="submit-button" type="submit">
          SUBMIT
        </button>
      </form>
    </main>
  </body>
</html>
